name: CI
on:
  push:
    branches:
      - rawhide
  pull_request:
    branches:
      - rawhide

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  CI:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.fedoraproject.org/fedora:rawhide
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build fedpkg
        run: sudo dnf -y install fedpkg
      - name: Install Deps
        run:  sudo dnf -y builddep ArborX.spec
      - name: Make SRPM
        run: |
          spectool -g ArborX.spec
          fedpkg srpm
      - name: Build rpm
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1 
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run: |
          . /etc/profile.d/modules.sh
          module avail
          fedpkg local 
