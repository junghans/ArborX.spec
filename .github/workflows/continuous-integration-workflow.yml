name: CI
on:
  push:
    branches:
      - rawhide
  pull_request:
    branches:
      - rawhide

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  CI:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.fedoraproject.org/fedora:rawhide
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build fedpkg
        run: sudo dnf -y install fedpkg
      - name: Get source 
        run: spectool -g ArborX.spec
      - name: Build rpm
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run:  fedpkg mockbuild --use-koji-mock-config
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mock-results
          path: results_ArborX
